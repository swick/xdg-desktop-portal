repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.7.0
  hooks:
    # Run the linter.
    - id: ruff
    # Run the formatter.
    - id: ruff-format
      args: [ --check ]
# Unfortunately precommit passes the changed files to mypy which then ignores the regex to exclude files. This means there is no way to restrict it to only some python files.
